name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.13.0', 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      # Includes tests/package.test.mjs: offline tarball install and the full installed-bin lifecycle.
      # Synthetic process/filesystem fixtures are external test preloads; Codex is never required.
      - name: Source tests and installed package acceptance (no core skips)
        run: npm test
      - run: npm run build
