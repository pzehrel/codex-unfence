name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate release version and npm tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: pnpm exec tsx scripts/release-metadata.ts
      - name: Run shared checks on the release commit
        run: pnpm run check --base HEAD
      - name: Pack release
        run: pnpm pack --out "$RUNNER_TEMP/codex-unfence.tgz"
      - name: Publish with npm trusted publishing
        env:
          NPM_TAG: ${{ steps.release.outputs.npm-tag }}
        run: pnpm dlx npm@11.16.0 publish "$RUNNER_TEMP/codex-unfence.tgz" --access public --provenance --ignore-scripts --tag "$NPM_TAG"
